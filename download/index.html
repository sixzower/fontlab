:root{--bg:#fff;--card:#f2f2f7;--card2:#e9e9ee;--accent:#1c1c1e;--on-accent:#fff;--seg-on:#fff;--label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
 --green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--bar:rgba(255,255,255,.82);--shadow:none;--menu:rgba(250,250,252,.94);--tabh:50px;--side:248px;
 --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Noto Sans Thai','Sarabun',Prompt,system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--accent:#f5f5f7;--on-accent:#000;--seg-on:#636366;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--bar:rgba(22,22,24,.78);--shadow:none;--menu:rgba(44,44,46,.94);color-scheme:dark}}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--accent:#f5f5f7;--on-accent:#000;--seg-on:#636366;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--bar:rgba(22,22,24,.78);--shadow:none;--menu:rgba(44,44,46,.94);color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{min-height:100dvh}
main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.page{display:none;width:100%}.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* nav + large title */
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);background:var(--bar);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-color:var(--sep)}
.nav-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;position:absolute;left:50%;transform:translateX(-50%);max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.nav.scrolled .nav-title{opacity:1}
.nav-actions{display:flex;gap:4px;margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;border-radius:22px;color:var(--accent);font-size:17px}
.icon-btn:disabled{color:var(--label3);cursor:default}
.icon-btn:not(:disabled):active{background:var(--fill)}
.large{padding:2px 20px 10px}.large h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.large p{margin:4px 0 0;color:var(--label2);font-size:15px}
.pad{padding:0 16px}
/* controls */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:36px;color:var(--label2);margin:6px 16px 10px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--card);color:var(--label);font-size:15px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;text-align:center}
.btn:active{filter:brightness(.88)}.btn:disabled{opacity:.4;cursor:default}
.btn.tint{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.small{min-height:36px;padding:0 14px;font-size:15px;border-radius:10px}
.btn.block{display:flex;width:100%}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px;font-weight:500}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--seg-on);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked=true]{background:var(--green)}.switch[aria-checked=true]::after{transform:translateX(20px)}
/* grouped lists */
.group-title{margin:18px 32px 6px;font-size:13px;text-transform:uppercase;color:var(--label2);letter-spacing:.02em}
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 16px;text-align:left;position:relative}
.row+.row::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.row:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--label2);font-size:13px}.row .val{color:var(--label2)}
.row .chev{color:var(--label3);width:.9em}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 8px;border-radius:8px;color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.foot{margin:6px 32px 0;color:var(--label2);font-size:13px}
/* font cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding:0 16px}
.card{position:relative;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .prev{border-radius:10px;height:84px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card canvas{image-rendering:pixelated;max-width:100%}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--label2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.card .more{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.75);color:#333;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.empty{text-align:center;color:var(--label2);padding:48px 32px}.empty h2{color:var(--label);margin:12px 0 4px;font-size:20px}
/* studio */
.studio{display:grid;gap:12px;padding:0 16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.studio{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);align-items:start}}
.panel{background:var(--card);border-radius:16px;padding:14px}
.panel h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;color:var(--label2);font-weight:600;letter-spacing:.02em}
.namefield{width:100%;background:none;border:0;outline:0;font-size:22px;font-weight:700;padding:0;margin-bottom:2px}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--orange) 16%,var(--card));border-radius:12px;padding:10px 12px;font-size:15px}
.banner .btn{margin-left:auto}
.stage{display:flex;justify-content:center;padding:6px 0 12px}
#edit{touch-action:none;border-radius:10px;image-rendering:pixelated;box-shadow:0 0 0 .5px var(--sep);cursor:crosshair;max-width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.tools .seg{flex:none}.tools .seg button{min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.swatches{display:flex;gap:8px;justify-content:center;margin:10px 0}
.swatch{width:44px;height:44px;border-radius:12px;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--sep);position:relative}
.swatch[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--card) inset}
.swatch span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--label2)}
.opsrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.opsrow .icon-btn{min-width:40px;height:40px;background:var(--fill);color:var(--label);border-radius:10px}
.advance{display:flex;align-items:center;gap:12px;margin-top:12px}.advance input[type=range]{flex:1;accent-color:var(--accent)}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:560px;overflow:auto;padding:2px}
.gl{border-radius:10px;background:var(--fill);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:11px;color:var(--label2)}
.gl canvas{image-rendering:pixelated;border-radius:3px}
.gl[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.preview-text{width:100%;border:0;background:var(--fill);border-radius:10px;padding:10px 12px;min-height:56px;resize:vertical;outline:0;font-size:17px;margin-bottom:10px}
.preview-box{border-radius:10px;overflow:auto;padding:8px;max-height:260px}
.preview-box canvas{image-rendering:pixelated;display:block}
/* forms in sheets */
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field>label,.field>span{font-size:13px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.input{width:100%;height:46px;border:0;border-radius:12px;background:var(--fill);padding:0 14px;outline:0;appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* sheets */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:bd .2s}
@keyframes bd{from{opacity:0}}
.sheet{width:min(100%,560px);max-height:92dvh;overflow:auto;background:var(--bg);box-shadow:0 -8px 40px rgba(0,0,0,.18);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px;max-height:86dvh}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:2px auto 12px}
.sheet h2{margin:0 0 4px;font-size:22px;text-align:center}.sheet .sub{margin:0 0 12px;text-align:center;color:var(--label2);font-size:15px}
.actions{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:10px}
.actions .row{justify-content:center;min-height:56px;color:var(--accent);font-size:19px}.actions .row.red{color:var(--red)}.actions .row.off{color:var(--label3);pointer-events:none}
.pre{background:var(--card2);border-radius:12px;padding:12px;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0}
/* tab bar + sidebar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:6px 8px calc(4px + env(safe-area-inset-bottom));-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);background:var(--bar);border-top:.5px solid var(--sep)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--label2);min-height:44px;font-weight:500}
.tab svg.i{width:26px;height:26px}.tab[aria-current=page]{color:var(--accent)}
.brand{display:none}.brand img{border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media(min-width:900px){
 main{margin-left:var(--side);padding-bottom:40px}
 .tabbar{top:0;right:auto;bottom:0;width:var(--side);flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(16px + env(safe-area-inset-top)) 12px 16px;border-top:0;border-right:.5px solid var(--sep)}
 .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;padding:4px 10px 18px}
 .tab{flex:none;flex-direction:row;max-width:none;justify-content:flex-start;gap:12px;font-size:17px;padding:0 12px;border-radius:10px;min-height:44px}
 .tab svg.i{width:22px;height:22px}.tab[aria-current=page]{background:var(--fill)}
 .nav{padding-left:20px}
}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,20px);z-index:200;background:rgba(40,40,44,.94);color:#fff;border-radius:22px;padding:10px 18px;font-size:15px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.25s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:28px;left:calc(50% + var(--side)/2)}}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--label3);flex:none}.status-dot.on{background:var(--green)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none!important}

/* iOS-style menu replacing native <select> */
.sel{width:100%;height:46px;border-radius:12px;background:var(--fill);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.sel span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel svg.i{width:1em;height:1em;color:var(--label2);transform:rotate(90deg)}
.sel[aria-expanded=true]{background:var(--fill2)}
select.native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.menu{position:fixed;z-index:300;min-width:200px;max-height:min(60dvh,420px);overflow:auto;padding:6px;border-radius:14px;background:var(--menu);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:0 10px 40px rgba(0,0,0,.22),0 0 0 .5px var(--sep);animation:pop .16s cubic-bezier(.2,.9,.3,1.2);transform-origin:top center}

.menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:0 12px;border-radius:9px;text-align:left;font-size:17px}
.menu button+button{background:linear-gradient(var(--sep),var(--sep)) top center/calc(100% - 24px) .5px no-repeat}
.menu button:active,.menu button:hover,.menu button:focus-visible{background-color:var(--fill)}
.menu button[aria-checked=true] svg.i{color:var(--label)}.menu button:not([aria-checked=true]) svg.i{visibility:hidden}

/* console picker (app-icon tiles) */
.cgroup{margin:0 16px 16px;background:var(--card);border-radius:22px;padding:16px 14px 18px}
.cgroup-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 14px;color:var(--label2);font-size:14px}.cgroup-h h2{margin:0;font-size:15px;font-weight:700;color:var(--label)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:20px 8px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:13px;font-weight:600;line-height:1.25;padding:2px;border-radius:14px;min-width:0}
.ctile:active .cico{transform:scale(.94)}.ctile small{font-size:11px;font-weight:400;color:var(--label2)}.cname{overflow-wrap:anywhere}
.cico{width:64px;height:64px;border-radius:17px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;transition:transform .15s;background:linear-gradient(180deg,color-mix(in srgb,var(--t) 72%,#fff),var(--t) 52%,color-mix(in srgb,var(--t) 70%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.22)}
.cico svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.cico b{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#fff;font-size:10px;letter-spacing:.03em;text-shadow:0 1px 2px rgba(0,0,0,.4)}

.tgl{background:var(--fill);color:var(--label);border-radius:10px;height:36px;min-width:40px}.tgl[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--label2);margin-top:16px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.zdot{width:14px;height:14px;border-radius:4px;flex:none}
.rules{margin:6px 0 12px;padding:0 4px 0 22px;font-size:14px;color:var(--label2);display:grid;gap:5px}.rules b{color:var(--label)}

.cbtn{position:relative}.cdot{position:absolute;top:9px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--label3);box-shadow:0 0 0 2px var(--bg)}
.cdot.ok{background:var(--green)}.cdot.busy{background:var(--orange);animation:pulse 1s ease-in-out infinite}.cdot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.sheet .cdot{position:static;flex:none;box-shadow:none}

const FontLabSchema="-- FontLab cloud backup: font data only, no login. Run once in your Supabase project's SQL Editor (safe to re-run).\n-- Each browser makes a random 256-bit backup code; only its SHA-256 hash is stored here. Whoever holds the code can\n-- read and write that code's fonts, so treat it like a password. Nothing else (ROMs, workspaces, admin data) is used.\n-- Tables are closed to every role; the browser can only call the four functions below.\ncreate table if not exists public.fontlab_vaults (\n  code_hash text primary key check (code_hash ~ '^[a-f0-9]{64}$'),\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.fontlab_vault_fonts (\n  code_hash text not null references public.fontlab_vaults(code_hash) on delete cascade,\n  font_id text not null check (font_id ~ '^[A-Za-z0-9_-]{6,64}$'),\n  name text not null check (char_length(name) between 1 and 100),\n  console text not null check (char_length(console) between 1 and 20),\n  width smallint not null check (width between 1 and 64),\n  height smallint not null check (height between 1 and 64),\n  bpp smallint not null check (bpp in (1,2,4,8)),\n  glyph_count integer not null check (glyph_count between 0 and 2048),\n  data jsonb not null check (jsonb_typeof(data) = 'object' and octet_length(data::text) <= 2097152),\n  updated_at timestamptz not null default now(),\n  primary key (code_hash, font_id)\n);\nalter table public.fontlab_vaults enable row level security;\nalter table public.fontlab_vault_fonts enable row level security;\nrevoke all on public.fontlab_vaults, public.fontlab_vault_fonts from anon, authenticated;\n\ncreate or replace function public.fontlab_list(p_code text)\nreturns table(font_id text, name text, console text, glyph_count integer, updated_at timestamptz)\nlanguage plpgsql security definer set search_path = pg_catalog as $$\ndeclare h text;\nbegin\n  if p_code is null or p_code !~ '^[a-f0-9]{64}$' then raise exception 'Invalid backup code'; end if;\n  h := encode(sha256(convert_to(p_code,'UTF8')),'hex');\n  return query select f.font_id, f.name, f.console, f.glyph_count, f.updated_at\n    from public.fontlab_vault_fonts f where f.code_hash = h order by f.updated_at desc limit 1000;\nend $$;\n\ncreate or replace function public.fontlab_get(p_code text, p_ids text[])\nreturns table(font_id text, data jsonb)\nlanguage plpgsql security definer set search_path = pg_catalog as $$\ndeclare h text;\nbegin\n  if p_code is null or p_code !~ '^[a-f0-9]{64}$' or p_ids is null or cardinality(p_ids) > 10 then raise exception 'Invalid request'; end if;\n  h := encode(sha256(convert_to(p_code,'UTF8')),'hex');\n  return query select f.font_id, f.data from public.fontlab_vault_fonts f where f.code_hash = h and f.font_id = any(p_ids);\nend $$;\n\ncreate or replace function public.fontlab_put(p_code text, p_fonts jsonb)\nreturns void language plpgsql security definer set search_path = pg_catalog as $$\ndeclare h text; r jsonb;\nbegin\n  if p_code is null or p_code !~ '^[a-f0-9]{64}$' or jsonb_typeof(p_fonts) is distinct from 'array' or jsonb_array_length(p_fonts) > 10 then raise exception 'Invalid request'; end if;\n  h := encode(sha256(convert_to(p_code,'UTF8')),'hex');\n  insert into public.fontlab_vaults(code_hash) values (h) on conflict do nothing;\n  perform 1 from public.fontlab_vaults v where v.code_hash = h for update;\n  for r in select value from jsonb_array_elements(p_fonts) loop\n    if not exists(select 1 from public.fontlab_vault_fonts f where f.code_hash = h and f.font_id = r->>'font_id')\n       and (select count(*) from public.fontlab_vault_fonts f where f.code_hash = h) >= 500 then\n      raise exception 'Backup limit: 500 fonts';\n    end if;\n    insert into public.fontlab_vault_fonts(code_hash,font_id,name,console,width,height,bpp,glyph_count,data,updated_at)\n    values (h, r->>'font_id', r->>'name', r->>'console', (r->>'width')::smallint, (r->>'height')::smallint, (r->>'bpp')::smallint,\n            (r->>'glyph_count')::integer, r->'data', coalesce((r->>'updated_at')::timestamptz, now()))\n    on conflict (code_hash, font_id) do update set name = excluded.name, console = excluded.console, width = excluded.width,\n      height = excluded.height, bpp = excluded.bpp, glyph_count = excluded.glyph_count, data = excluded.data, updated_at = excluded.updated_at;\n  end loop;\nend $$;\n\ncreate or replace function public.fontlab_delete(p_code text, p_ids text[])\nreturns void language plpgsql security definer set search_path = pg_catalog as $$\ndeclare h text;\nbegin\n  if p_code is null or p_code !~ '^[a-f0-9]{64}$' or p_ids is null or cardinality(p_ids) > 50 then raise exception 'Invalid request'; end if;\n  h := encode(sha256(convert_to(p_code,'UTF8')),'hex');\n  delete from public.fontlab_vault_fonts f where f.code_hash = h and f.font_id = any(p_ids);\nend $$;\n\nrevoke all on function public.fontlab_list(text), public.fontlab_get(text,text[]), public.fontlab_put(text,jsonb), public.fontlab_delete(text,text[]) from public;\ngrant execute on function public.fontlab_list(text), public.fontlab_get(text,text[]), public.fontlab_put(text,jsonb), public.fontlab_delete(text,text[]) to anon, authenticated;\n-- The earlier email-login table (public.fontlab_fonts), if you created it, is no longer used. Drop it if you wish:\n-- drop table if exists public.fontlab_fonts;\n";

/* ---------- Thai drawing zones ----------

   lower vowels and descenders on rows 12–15. Other heights scale proportionally. */

/* ---------- automatic shadow ----------

   direction, only on empty cells inside the glyph box. Letters that would end up wider than their advance get a
   wider advance (up to the cell width); vowel/tone marks keep theirs. */
const SHADOW_DIRS={'down-right':[1,1],'down':[0,1],'right':[1,0],'down-left':[-1,1]};

<script>/* FontLab cloud backup: no login. A random backup code (kept in this browser) names a vault in Supabase;
   four SQL functions (cloud/fontlab.sql) store font data only. Public project key only. */
const FontLabCloud=(()=>{
 const cfg=()=>window.FontLabConfig,KEY='fontlab.code.v2',DEL='fontlab.deleted.v1',valid=c=>/^[a-f0-9]{64}$/.test(c||'');
 let mem=null,memTombs=[];
 const hex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,'0')).join('');
 function code(){try{const c=localStorage.getItem(KEY);if(valid(c)){mem=c;return c;}}catch{}if(!valid(mem)){mem=hex(32);try{localStorage.setItem(KEY,mem);}catch{}}return mem;}
 function setCode(c){c=String(c||'').trim().toLowerCase();if(!valid(c))throw Error('รหัสต้องเป็นตัวอักษร 0-9 a-f จำนวน 64 ตัว');mem=c;try{localStorage.setItem(KEY,c);}catch{}return c;}
 const newCode=()=>setCode(hex(32));
 const persistent=()=>{try{return localStorage.getItem(KEY)===mem&&valid(mem);}catch{return false;}};
 function explain(res,body){const m=body?.message||body?.hint||body?.error||'';
  if(res.status===404||/Could not find the function|PGRST202|does not exist/i.test(m))return'ยังไม่ได้ติดตั้ง SQL บน Supabase — เปิดหน้าสำรองข้อมูลแล้วคัดลอก SQL ไปรันครั้งเดียว';
  if(/Backup limit/i.test(m))return'ถึงขีดจำกัด 500 ฟอนต์ต่อรหัสแล้ว';if(/Invalid/i.test(m))return'คำขอไม่ถูกต้อง';return m||'เกิดข้อผิดพลาด ('+res.status+')';}
 async function rpc(name,args){let res;try{res=await fetch(cfg().url+'/rest/v1/rpc/'+name,{method:'POST',credentials:'omit',cache:'no-store',headers:{apikey:cfg().key,'Content-Type':'application/json'},body:JSON.stringify(args)});}catch{throw Error('ติดต่อ Supabase ไม่ได้ (ออฟไลน์?) จะลองใหม่เมื่อมีการบันทึกครั้งถัดไป');}
  const text=await res.text();let json=null;try{json=text?JSON.parse(text):null;}catch{}if(!res.ok)throw Error(explain(res,json));return json;}

 const listMeta=async()=>await rpc('fontlab_list',{p_code:code()})||[];
 const get=async ids=>await rpc('fontlab_get',{p_code:code(),p_ids:ids})||[];
 async function put(fonts){for(let i=0;i<fonts.length;i+=5)await rpc('fontlab_put',{p_code:code(),p_fonts:fonts.slice(i,i+5).map(row)});}
 async function remove(ids){for(let i=0;i<ids.length;i+=50)await rpc('fontlab_delete',{p_code:code(),p_ids:ids.slice(i,i+50)});}
 const tombs=()=>{try{return JSON.parse(localStorage.getItem(DEL)||'[]');}catch{return memTombs;}};
 const setTombs=a=>{memTombs=[...new Set(a)];try{localStorage.setItem(DEL,JSON.stringify(memTombs));}catch{}};
 /* newest wins. local = the user's (non built-in) fonts */
 async function sync(local,{onDownload,onProgress=()=>{}}){
  onProgress('กำลังตรวจรายการบนคลาวด์…');const meta=await listMeta(),cloud=new Map(meta.map(m=>[m.font_id,m])),dead=tombs().filter(id=>cloud.has(id));
  if(dead.length){await remove(dead);dead.forEach(id=>cloud.delete(id));}setTombs([]);
  const have=new Map(local.map(f=>[f.id,f])),up=[],down=[];
  for(const f of local){const c=cloud.get(f.id);if(!c||(f.updatedAt||0)>Date.parse(c.updated_at)+1000)up.push(f);}
  for(const [id,c] of cloud){const f=have.get(id);if(!f||Date.parse(c.updated_at)>(f.updatedAt||0)+1000)down.push(id);}
  if(up.length){onProgress('กำลังอัปโหลด '+up.length+' ฟอนต์…');await put(up);}
  let n=0;for(let i=0;i<down.length;i+=5){const ids=down.slice(i,i+5);onProgress('กำลังดึงฟอนต์ '+Math.min(i+5,down.length)+'/'+down.length+'…');for(const r of await get(ids)){n++;await onDownload(r.data);}}
  return{uploaded:up.length,downloaded:n,total:cloud.size+up.filter(f=>!meta.some(m=>m.font_id===f.id)).length};}

})();

 try{const r=await FontLabCloud.sync(userFonts(),{onProgress:m=>setCloud('busy',m),onDownload:async raw=>{const f=Core.normalize(raw);S.fonts.set(f.id,f);await Store.put(f);}});
  S.cloud.last=new Date();S.cloud.count=r.total;setCloud('ok');if(r.downloaded){renderLibrary();toast('ดึงฟอนต์จากคลาวด์ '+r.downloaded+' ตัว');}else if(!quiet)toast('ซิงก์แล้ว');}
 catch(e){setCloud('err',e.message);if(!silent&&(!quiet||!S.cloud.warned)){S.cloud.warned=true;toast(e.message);}}

async function importFiles(files){
 for(const file of files){const ext=file.name.split('.').pop().toLowerCase();
  try{
   if(ext==='json'){const raw=JSON.parse(await file.text());let f=Core.normalize(raw);if(S.fonts.has(f.id)||f.builtin)f={...f,id:Core.uid(),builtin:undefined,name:f.name+' (นำเข้า)'};f.updatedAt=Date.now();await addFont(f,{open:files.length===1});toast('นำเข้า “'+f.name+'” แล้ว');}
   else if(ext==='png'||ext==='bin'){const f=editable();if(!f)throw Error('เปิดฟอนต์ที่แก้ไขได้ในสตูดิโอก่อน แล้วนำเข้า .'+ext);
    let px;if(ext==='bin')px=Core.importBank(f,new Uint8Array(await file.arrayBuffer()));
    else{const bmp=await createImageBitmap(file),cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bmp,0,0);px=Core.readSheet(f,cx.getImageData(0,0,bmp.width,bmp.height).data,bmp.width,bmp.height);}
    S.undo=[];S.redo=[];px.forEach((p,i)=>{f.glyphs[i].p=p;});touch(f);mountStudio();toast('นำเข้า '+px.length+' ตัวอักษรจาก '+file.name);}
   else throw Error('รองรับเฉพาะ .json .png .bin');
  }catch(e){toast(file.name+': '+e.message);}}}
function pickFiles(accept){const i=$('#pick');i.accept=accept;i.value='';i.onchange=()=>importFiles([...i.files]);i.click();}

function transform(op){if(!guardEdit())return;const {f,g,buf}=cur(),w=f.w,h=f.h;let out=new Uint8Array(w*h);

 else if(op==='flip-h'){for(let y=0;y<h;y++)for(let x=0;x<w;x++)out[y*w+x]=buf[y*w+(w-1-x)];}
 else if(op==='flip-v'){for(let y=0;y<h;y++)for(let x=0;x<w;x++)out[y*w+x]=buf[(h-1-y)*w+x];}
 else if(op==='clear'){}

 else if(op==='paste'){if(!S.clip)return toast('ยังไม่ได้คัดลอกอักษร');const p=S.clip.w===w&&S.clip.h===h?S.clip.p:Core.resizeGlyph(S.clip.p,S.clip.w,S.clip.h,w,h);out=Uint8Array.from(p,c=>+c);}

  +'<div class="group-title" style="margin:6px 4px">รหัสสำรองของคุณ</div><div class="group" style="margin:0 0 6px"><div class="row"><span class="grow" style="font-family:ui-monospace,Menlo,monospace;font-size:14px;overflow-wrap:anywhere" id="cc-code">'+mask(FontLabCloud.code())+'</span></div></div>'
  +'<div class="grid2" style="margin-bottom:6px"><button class="btn tint small" id="cc-show">แสดงรหัส</button><button class="btn tint small" id="cc-copy">คัดลอกรหัส</button></div>'
  +'<p class="foot" style="margin:0 4px 12px">ใช้รหัสนี้บนเครื่องอื่นเพื่อดึงฟอนต์ทั้งหมดมา เก็บไว้ให้ดีเหมือนรหัสผ่าน ใครมีรหัสก็เปิดฟอนต์ชุดนี้ได้'+(FontLabCloud.persistent()?'':' · เบราว์เซอร์นี้เก็บรหัสถาวรไม่ได้ จดรหัสไว้ด้วย')+'</p>'
  +'<div class="group-title" style="margin:6px 4px">ใช้รหัสจากเครื่องอื่น</div><div class="field" style="margin:0 0 8px"><input id="cc-in" class="input" placeholder="วางรหัส 64 ตัวอักษร" autocomplete="off" spellcheck="false" aria-label="รหัสสำรองจากเครื่องอื่น"></div>'
  +'<div class="actions"><button class="row" id="cc-use">เชื่อมต่อด้วยรหัสนี้และรวมฟอนต์</button><button class="row" id="cc-sync">ซิงก์ตอนนี้</button><button class="row" id="cc-sql">คัดลอก SQL ติดตั้ง (ทำครั้งเดียว)</button></div>'
  +'<button class="btn gray block" data-close>ปิด</button>',s=>{
  let shown=false;const code=$('#cc-code',s);
  $('#cc-show',s).onclick=e=>{shown=!shown;code.textContent=shown?FontLabCloud.code():mask(FontLabCloud.code());e.target.textContent=shown?'ซ่อนรหัส':'แสดงรหัส';};
  $('#cc-copy',s).onclick=async()=>{try{await navigator.clipboard.writeText(FontLabCloud.code());toast('คัดลอกรหัสแล้ว');}catch{shown=true;code.textContent=FontLabCloud.code();const r=document.createRange();r.selectNodeContents(code);getSelection().removeAllRanges();getSelection().addRange(r);toast('เลือกรหัสไว้แล้ว กดคัดลอกเอง');}};
  $('#cc-use',s).onclick=()=>{try{FontLabCloud.setCode($('#cc-in',s).value);}catch(e){return toast(e.message);}closeSheet();toast('เชื่อมต่อแล้ว กำลังรวมฟอนต์…');syncNow(false);};
  $('#cc-sync',s).onclick=()=>{syncNow(false);};
  $('#cc-sql',s).onclick=async()=>{try{await navigator.clipboard.writeText(FontLabSchema);toast('คัดลอก SQL แล้ว วางใน Supabase SQL Editor แล้วกด Run');}catch{closeSheet();schemaSheet();}};});}
function schemaSheet(){sheet('<h2>SQL ติดตั้ง</h2><p class="sub">คัดลอกแล้ววางใน Supabase → SQL Editor → Run (ทำครั้งเดียว รันซ้ำได้ปลอดภัย)</p><div class="pre" tabindex="0">'+esc(FontLabSchema)+'</div><button class="btn block" id="sc-copy">คัดลอก SQL</button>',s=>{
 $('#sc-copy',s).onclick=async()=>{try{await navigator.clipboard.writeText(FontLabSchema);toast('คัดลอก SQL แล้ว');}catch{const r=document.createRange();r.selectNodeContents($('.pre',s));getSelection().removeAllRanges();getSelection().addRange(r);toast('เลือกข้อความไว้แล้ว กดคัดลอกด้วยตัวเอง');}};});}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target;
 const tab=t.closest('[data-tab]');if(tab)return go(tab.dataset.tab);
 const more=t.closest('[data-more]');if(more){e.stopPropagation();return fontMenu(more.dataset.more);}
 const open=t.closest('[data-open]');if(open)return openStudio(open.dataset.open);
 const fl=t.closest('[data-filter]');if(fl){S.filter=fl.dataset.filter;return renderLibrary();}
 const con=t.closest('[data-console]');if(con)return consoleSheet(con.dataset.console);
 const tool=t.closest('[data-tool]');if(tool){S.tool=tool.dataset.tool;return $$('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b===tool));}
 const col=t.closest('[data-color]');if(col){S.color=+col.dataset.color;S.tool=S.tool==='eraser'?'pencil':S.tool;$$('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===S.tool));return $$('[data-color]').forEach(b=>b.setAttribute('aria-pressed',b===col));}
 const op=t.closest('[data-op]');if(op)return transform(op.dataset.op);
 const gl=t.closest('.gl');if(gl)return selectGlyph(+gl.dataset.i);
 const a=t.closest('[data-act]')?.dataset.act;if(!a||t.closest('.sheet'))return;
 if(a==='theme'){applyTheme(isDark()?'light':'dark',true);return;}
 if(a==='new')newFontSheet();else if(a==='import')pickFiles('.json,application/json,.png,.bin');else if(a==='settings')settingsSheet();else if(a==='export')exportSheet();
 else if(a==='add-glyph')addGlyphSheet();else if(a==='check-all')checkAllSheet();else if(a==='shadow')shadowSheet();else if(a==='guides'){S.guides=!S.guides;$$('[data-act=guides]').forEach(b=>b.setAttribute('aria-pressed',S.guides));drawEditor();}else if(a==='grid'){S.grid=!S.grid;drawEditor();}
 else if(a==='dup-edit'){const f=S.fonts.get(S.cur),d=duplicate(f);addFont(d).then(()=>{openStudio(d.id);toast('ทำสำเนาแล้ว แก้ไขได้เลย');});}
 else if(a==='cloud')cloudSheet();});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.query=e.target.value;renderLibrary();}});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches?.('.card')){openStudio(e.target.dataset.open);return;}
 if(S.tab!=='studio'||!(e.ctrlKey||e.metaKey)||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
 if(e.key.toLowerCase()==='z'){e.preventDefault();stepHistory(e.shiftKey?1:-1);}else if(e.key.toLowerCase()==="y"){e.preventDefault();stepHistory(1);}});
document.addEventListener('click',e=>{if(e.target.closest('#u-undo'))stepHistory(-1);if(e.target.closest("#u-redo"))stepHistory(1);});
addEventListener('resize',()=>{if(S.tab==='studio'&&edit&&S.fonts.get(S.cur)){sizeEditor();drawEditor();drawPreview();}});
addEventListener('beforeunload',()=>{for(const [id,t] of saveTimers){clearTimeout(t);const f=S.fonts.get(id);if(f)Store.put(f);}});
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)&&t!==S.tab)go(t,{push:false});});

/* ---------- boot ---------- */
(async()=>{
 for(const b of FontLabBuiltins)S.fonts.set(b.id,b);
 await Store.init();
 try{for(const raw of await Store.all()){try{const f=Core.normalize(raw);S.fonts.set(f.id,f);}catch{}}}catch{}
 applyTheme(document.documentElement.dataset.theme,false);
 const start=location.hash.slice(1);go(TABS.some(x=>x[0]===start)?start:'library',{push:false});
 if(!Store.persistent())toast('เบราว์เซอร์นี้ไม่อนุญาตให้เก็บฟอนต์ถาวร · ส่งออกไฟล์ไว้เสมอ');
 syncNow(true,true);
})();
/* ---------- freshness: drop leftovers of the old app, load a newer version by itself ---------- */
(async()=>{
 try{for(const r of await navigator.serviceWorker?.getRegistrations?.()||[])r.unregister();if(window.caches)for(const k of await caches.keys())caches.delete(k);}catch{}
 try{const cur=document.querySelector('meta[name=app-version]')?.content;if(!cur||location.protocol==='file:')return;
  const res=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)return;const v=(await res.json()).version;
  if(v&&v!==cur){const u=new URL(location.href);if(u.searchParams.get('v')!==v){u.searchParams.set('v',v);location.replace(u.href);}}}catch{}
})();
window.FontLabApp={S,Store,go,openStudio};
})();
</script>
</body>
